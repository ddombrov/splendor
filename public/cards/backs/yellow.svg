<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 380.79" width="518" height="789">
  <defs>
    <!-- Diamond lattice pattern -->
    <pattern id="lattice" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#d9a21b"/>
      <path d="M10 0 L20 10 L10 20 L0 10 Z" fill="#ebb935" stroke="#7a5212" stroke-width="0.6"/>
      <circle cx="10" cy="10" r="1.4" fill="#fff4cc"/>
      <circle cx="0" cy="0" r="1" fill="#fff4cc"/>
      <circle cx="20" cy="0" r="1" fill="#fff4cc"/>
      <circle cx="0" cy="20" r="1" fill="#fff4cc"/>
      <circle cx="20" cy="20" r="1" fill="#fff4cc"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="panel">
      <rect x="16" y="16" width="218" height="348.79" rx="8"/>
    </clipPath>
  </defs>

  <!-- Card body -->
  <rect x="1" y="1" width="248" height="378.79" rx="16" fill="#fbf8f1" stroke="#c9c2b4" stroke-width="2"/>

  <!-- Patterned panel -->
  <g clip-path="url(#panel)">
    <rect x="16" y="16" width="218" height="348.79" fill="url(#lattice)"/>
    <rect x="16" y="16" width="218" height="348.79" fill="url(#vignette)"/>
  </g>

  <!-- Double gold frame -->
  <rect x="16" y="16" width="218" height="348.79" rx="8" fill="none" stroke="#7a5212" stroke-width="3"/>
  <rect x="24" y="24" width="202" height="332.79" rx="5" fill="none" stroke="#fff4cc" stroke-width="1"/>
</svg>
